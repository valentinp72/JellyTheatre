<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
	<link rel="manifest" href="/manifest.json">
    <title>Hello, World! - A-Frame</title>
    <meta name="description" content="Hello, World! - A-Frame">
    <script src="/aframe.min.js"></script>
	<script type="module" src="/app.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  </head>
  <body>
    <a-scene renderer="antialias:true; highRefreshRate: true; foveationLevel:0; precision:high; logarithmicDepthBuffer: true;" reflection="directionalLight:a-light#dirlight;" >
      <!-- <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box> -->
      <!-- <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere> -->
      <!-- <a-cylinder position="1 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder> -->
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>

      <a-light id="dirlight" intensity="1" light="castShadow:true;type:directional" position="0 2 -5"></a-light>
      <a-text id="text-element" value="Coucou" geometry="primitive:plane" scale="2 2 1" position="-10 2 -4"></a-text>
	  <a-video autoplay controls id="video-player" src="" width="8" height="4.5" position="0 2 -10"></a-video>

      <!-- <a-sky color="#ECECEC"></a-sky> -->
	  <a-sky id="a_sky" hide-in-ar-mode="" skybox_dynamic="" material="" geometry="" scale="" src="/background-sky.jpeg" radius="200" theta-length="180" visible=""></a-sky>

	  <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .raycastable" line="color: #118A7E"></a-entity>
      <a-entity id="rightHand" laser-controls="hand: right" raycaster="objects: .raycastable" line="color: #118A7E"></a-entity>

    </a-scene>
  </body>
</html>
