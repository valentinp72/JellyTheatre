<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<link rel="manifest" href="./manifest.json">
		<title>JellyTheatre</title>
		<meta name="description" content="JellyTheatre VR client for Jellyfin.">
		<script src="./assets/aframe.min.js"></script>
		<script src="https://binzume.github.io/aframe-xylayout/dist/xylayout-all.min.js"></script>
		<script src="./components/screen.js"></script>
		<script src="./components/tablet.js"></script>
		<script type="module" src="./app.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
		<script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
	</head>
	<body>
		<a-scene 
			renderer="antialias:true; highRefreshRate: true; foveationLevel:0; precision:high; logarithmicDepthBuffer: true;"
			reflection="directionalLight:a-light#dirlight;">

			<a-light
				id="dirlight"
				intensity="1"
				light="castShadow:true;type:directional"
				position="0 2 -5"
			></a-light>

			<a-entity id="video-screen" screen="videoUrl: https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8;  position: 0 5 -10"></a-entity>

			<a-entity environment="preset: starry"></a-entity>

			<a-xywindow 
				scale="0.3 0.3 0.3" rotation="0 -60 0" position="2 2 -0.5"
				width="12" height="5" title="JellyTheatre"
				xywindow="background:true"
				tablet="screen: #video-screen"
			>
				<a-xycontainer direction="column" spacing="0.1" padding="0.2">
					<a-xybutton id="btn_playpause"></a-xybutton>
					<a-xytoggle value="true"></a-xytoggle>
					<a-xyrange width="4" height="0.5" value="20"></a-xyrange>
				</a-xycontainer>
			</a-xywindow>

			<a-xykeyboard scale="0.3 0.3 0.3" position="0 1.1 -3" rotation="-30 0 0"></a-xykeyboard>
			<a-entity
				id="leftHand"
				laser-controls="hand: left"
				raycaster="far:Infinity;objects:.collidable"
				line="color: #118A7E"
			></a-entity>
			<a-entity
				id="rightHand"
				laser-controls="hand: right"
				raycaster="far:Infinity;objects:.collidable"
				line="color: #118A7E"
			></a-entity>
			<a-entity cursor="rayOrigin: mouse; fuse:false" raycaster="objects:.collidable;far:5500"></a-entity>

		</a-scene>
	</body>
</html>
